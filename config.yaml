model:
  backbone: "nvidia/mit-b5"
  # timm/HF-Hub alternative backbones (any model with a 4-stage feature pyramid):
  #   backbone: "timm:resnet50"                 # CNN pyramid, matches decoder design (4/8/16/32 strides)
  #   backbone: "timm:convnext_base.fb_in22k"
  # NOTE: "timm:vit_base_r50_s16_384.orig_in21k_ft_in1k" (TransUNet's R50+ViT-B/16 hybrid) loads
  # fine but its features_only output is 4 identical stride-16 maps (pure ViT tokens, no spatial
  # pyramid) -- the multi-scale decoder fusion becomes a no-op. Use a plain CNN/hierarchical
  # timm model instead unless you also rewrite the decoder for single-scale ViT features.
  backbone_kwargs: null
  freeze_backbone: true
  num_seg_classes: 1
  num_det_classes: 1
  img_size: [512, 512]

data:
  data_dir: "./Arcade"
  batch_size: 8
  num_workers: 4

training:
  max_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.01
  lambda_seg: 1.0
  lambda_det: 1.0
  lambda_cls: 1.0

wandb:
  project: "arcade-xca-dual-task"
  entity: null
