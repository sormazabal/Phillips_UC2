model:
  backbone: "nvidia/mit-b3"
  freeze_backbone: true
  num_seg_classes: 1
  num_det_classes: 1
  img_size: [512, 512]

data:
  data_dir: "./Arcade"
  batch_size: 8
  num_workers: 4

training:
  max_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.01
  lambda_seg: 1.0
  lambda_det: 1.0
  lambda_cls: 1.0

wandb:
  project: "arcade-xca-dual-task"
  entity: null
